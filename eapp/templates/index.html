{%extends 'layout/base.html'%}

{%block content%}
<section class="container">
    {%if products%}
    <div class="row">
        {%for p in products%}
        <div class="col-md-3 col-6 p-2">

            <div class="card" style="weight: 400px">
                <img class="card-img-top" src="{{p.image}}" alt="Card image">
                <div class="card-body">
                    <h4 class="card-title">{{p.name}}</h4>
                    <p class="card-text">{{p.price}} VND</p>
                    <a href="#" class="btn btn-primary">Xem chi tiet</a>
                    <button class="btn btn-danger">Dat hang</button>
                </div>
            </div>
        </div>
        {%endfor%}
    </div>
    {%else%}
    <div class="alert alert-warning mt-2">KHONG tim thay san pham!</div>
    {%endif%}
</section>
{%endblock%}
