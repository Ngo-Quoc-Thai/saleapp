{% extends 'admin/master.html' %}

{% block body %}
<h1>WELCOME AND GOOD BYE</h1>
<form action="/">
  <div class="form-group">
    <label for="email">Ten dang nhap</label>
    <input type="text" class="form-control" placeholder="Ten danh nhap" id="username">
  </div>
  <div class="form-group">
    <label for="pwd">Password:</label>
    <input type="password" class="form-control" placeholder="Nhap mat khau" id="pwd">
  </div>
  <div class="form-group form-check">
    <label class="form-check-label">
      <input class="form-check-input" type="checkbox"> Remember me
    </label>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endblock %}
